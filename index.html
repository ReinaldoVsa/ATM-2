<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saque Digital Pro - ATM & Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        #reader__scan_region { background: white !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

    <div id="mode-selector" class="fixed top-4 right-4 z-50">
        <select onchange="switchMode(this.value)" class="p-2 rounded-lg border shadow-sm text-sm font-bold">
            <option value="user">Modo: Aplicativo Usuário</option>
            <option value="atm">Modo: Terminal ATM</option>
        </select>
    </div>

    <main id="view-user" class="max-w-md mx-auto p-6">
        <header class="py-8">
            <h1 class="text-3xl font-extrabold text-blue-900">Banco<span class="text-blue-500">Flux</span></h1>
            <p class="text-gray-500 font-medium">Saque sem cartão via QR Code</p>
        </header>

        <section id="user-home" class="space-y-6">
            <div class="bg-white p-6 rounded-3xl shadow-xl border border-gray-100">
                <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Quanto deseja sacar?</label>
                <div class="flex items-center">
                    <span class="text-3xl font-bold text-gray-400 mr-2">R$</span>
                    <input type="number" id="withdraw-amount" value="100" class="w-full text-4xl font-black text-blue-600 outline-none">
                </div>
            </div>
            
            <button onclick="openScanner()" class="w-full gradient-bg text-white py-5 rounded-2xl font-bold text-lg shadow-blue-200 shadow-2xl active:scale-95 transition-all">
                ESCANEAR QR NO CAIXA
            </button>
        </section>

        <section id="user-scanner" class="hidden space-y-4">
            <div id="reader" class="rounded-3xl overflow-hidden shadow-2xl border-4 border-white"></div>
            <button onclick="location.reload()" class="w-full text-gray-400 font-bold py-2">CANCELAR</button>
        </section>

        <section id="user-status" class="hidden text-center p-10">
            <div id="status-icon" class="text-6xl mb-4">⌛</div>
            <h2 id="status-msg" class="text-2xl font-bold text-gray-800">Processando...</h2>
        </section>
    </main>

    <main id="view-atm" class="hidden fixed inset-0 bg-zinc-950 flex items-center justify-center p-4">
        <div class="bg-zinc-900 w-full max-w-2xl aspect-video rounded-[3rem] border-[12px] border-zinc-800 shadow-2xl flex flex-col items-center justify-center text-center p-8">
            <div id="atm-idle">
                <h2 class="text-zinc-500 font-mono tracking-widest mb-2">CAIXA ELETRÔNICO #082</h2>
                <h1 class="text-4xl font-bold text-white mb-8">Toque ou use o App</h1>
                <div class="bg-white p-6 rounded-2xl inline-block mb-6 shadow-[0_0_50px_rgba(59,130,246,0.3)]">
                    <div id="atm-qrcode"></div>
                </div>
                <p class="text-blue-400 font-mono animate-pulse">Aguardando leitura do QR Code...</p>
            </div>

            <div id="atm-processing" class="hidden">
                <div class="w-20 h-20 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-6"></div>
                <h2 class="text-3xl font-bold text-white">Validando Transação...</h2>
            </div>

            <div id="atm-release" class="hidden">
                <div class="text-8xl mb-4 animate-bounce">💸</div>
                <h2 class="text-4xl font-black text-green-400 uppercase">Saque Autorizado!</h2>
                <p class="text-zinc-400 mt-2 text-xl">Retire suas notas na gaveta inferior.</p>
            </div>
        </div>
    </main>

    <script>
        // CONFIGURAÇÕES DE PRODUÇÃO
        const SOCKET_SERVER = "https://atm-saque.vercel.app"; // Substituir pela URL real do seu backend
        const ATM_ID = "ATM_082_SAO_PAULO";
        let socket;

        // INICIALIZAÇÃO
        function init() {
            // Conecta ao WebSocket (opcional para o modo usuário, obrigatório para o ATM)
            try {
                socket = io(SOCKET_SERVER);
                socket.on('connect', () => socket.emit('register-atm', ATM_ID));
                
                socket.on('release-cash', (data) => {
                    showAtmRelease(data.amount);
                });
            } catch(e) { console.warn("Socket offline - operando em modo simulação local"); }
            
            generateAtmQR();
        }

        // LÓGICA DO USUÁRIO (MOBILE)
        function openScanner() {
            document.getElementById('user-home').classList.add('hidden');
            document.getElementById('user-scanner').classList.remove('hidden');

            const scanner = new Html5QrcodeScanner("reader", { fps: 20, qrbox: 250 });
            scanner.render((decodedText) => {
                scanner.clear();
                submitWithdraw(decodedText);
            });
        }

        async function submitWithdraw(scannedAtmId) {
            document.getElementById('user-scanner').classList.add('hidden');
            document.getElementById('user-status').classList.remove('hidden');
            
            const amount = document.getElementById('withdraw-amount').value;

            try {
                // Chamada real para o seu backend Node.js
                const response = await fetch(`${SOCKET_SERVER}/api/withdraw`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ atmId: scannedAtmId, amount: amount, userId: "USER_123" })
                });
                const resData = await response.json();

                if(resData.success) {
                    document.getElementById('status-icon').innerText = "✅";
                    document.getElementById('status-msg').innerText = "Saque Confirmado!";
                }
            } catch (err) {
                // Simulação caso o servidor não esteja pronto
                document.getElementById('status-msg').innerText = "Erro: Servidor não configurado.";
            }
        }

        // LÓGICA DO TERMINAL (ATM)
        function generateAtmQR() {
            const qrContainer = document.getElementById("atm-qrcode");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: ATM_ID,
                width: 200,
                height: 200
            });
        }

        function showAtmRelease(amount) {
            document.getElementById('atm-idle').classList.add('hidden');
            document.getElementById('atm-release').classList.remove('hidden');
            setTimeout(() => location.reload(), 8000);
        }

        // ALTERNAR VISÕES (Simulação de dispositivos diferentes)
        function switchMode(mode) {
            document.getElementById('view-user').classList.toggle('hidden', mode !== 'user');
            document.getElementById('view-atm').classList.toggle('hidden', mode !== 'atm');
            if(mode === 'atm') init();
        }

        window.onload = init;
    </script>
</body>
</html>
